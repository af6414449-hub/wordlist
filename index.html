<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wordlist</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
        margin: 0; padding: 0;
        background: #1b1c1d;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 14px; line-height: 1.5;
        height: 100%;
        overflow: hidden;
    }
    body { user-select: none; }

    .stage {
        position: fixed;
        top: 0; left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 1100px;
        height: 100vh;
        height: 100dvh;
        background: #1b1c1d;
        box-shadow: 0 0 60px rgba(0,0,0,0.7);
        display: flex; flex-direction: column;
        overflow: hidden;
    }

    /* ===== Шапка ===== */
    .topbar {
        min-height: 72px; flex: 0 0 auto;
        background: #1b1c1d;
        display: flex; align-items: center;
        padding: 0 1em 0 1.5em;
        gap: 0.5em;
    }
    .brand { display: flex; align-items: center; gap: 0.5em; }

    .lang-badge {
        display: inline-flex; align-items: center; justify-content: center;
        height: 56px;
        min-width: 130px;
        padding: 0 1.2em;
        border-radius: 12px;
        background: #6b8cae; color: #fff;
        font-family: inherit;
        font-size: 17px; font-weight: 700;
        letter-spacing: 0.02em;
        cursor: pointer;
        transition: transform 0.12s, filter 0.15s;
        border: none;
    }
    .lang-badge:hover  { filter: brightness(1.1); }
    .lang-badge:active { transform: scale(0.94); }

    .level-icon {
        display: inline-flex; align-items: center; justify-content: center;
        width: 56px; height: 56px; border-radius: 12px;
        background: #e57373; color: #fff;
        font-family: inherit;
        font-size: 18px; font-weight: 700;
        cursor: pointer;
        transition: transform 0.12s, filter 0.15s;
        border: none;
    }
    .level-icon:hover  { filter: brightness(1.1); }
    .level-icon:active { transform: scale(0.94); }

    .topbar .right { margin-left: auto; display: flex; gap: 0.5em; align-items: center; }

    .history-btn {
        height: 56px; padding: 0 1.6em;
        background: #8e44ad; color: #fff;
        border: none; border-radius: 12px;
        font-size: 18px; font-weight: 600; font-family: inherit;
        cursor: pointer;
        transition: transform 0.1s, filter 0.15s;
    }
    .history-btn:hover  { filter: brightness(1.1); }
    .history-btn:active { transform: scale(0.96); }

    .settings-btn {
        width: 56px; height: 56px;
        background: rgba(255,255,255,0.12); color: #fff;
        border: none; border-radius: 12px;
        display: inline-flex; align-items: center; justify-content: center;
        cursor: pointer;
        transition: transform 0.12s, background 0.15s;
    }
    .settings-btn:hover  { background: rgba(255,255,255,0.2); }
    .settings-btn:active { transform: rotate(45deg) scale(0.92); }
    .settings-btn svg { width: 28px; height: 28px; }

    /* ===== Контент ===== */
    .wrapper {
        flex: 1 1 auto;
        display: flex; flex-direction: column;
        min-height: 0;
        overflow: hidden;
    }

    .levels-board {
        flex: 1 1 auto;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 8px;
        padding: 8px;
        min-height: 0;
    }
    .level-tile {
        position: relative;
        border: none;
        border-radius: 20px;
        font-family: inherit;
        font-size: clamp(48px, 12vw, 96px);
        font-weight: 800;
        letter-spacing: -0.04em;
        color: #ffffff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: transform 0.12s cubic-bezier(.2,.8,.2,1), filter 0.15s, box-shadow 0.2s, opacity 0.2s;
        -webkit-tap-highlight-color: transparent;
        padding: 0;
        opacity: 0.75;
    }

    /* Неактивные уровни — приглушены, но читаемы */
    .level-tile:hover:not(.disabled):not(.active) {
        opacity: 1;
        filter: brightness(1.05);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .level-tile:active:not(.disabled) {
        transform: scale(0.97);
        transition-duration: 0.05s;
    }

    /* Активный — яркий и слегка увеличен, без налезания */
    .level-tile.active {
        opacity: 1;
        box-shadow: 0 10px 28px rgba(0,0,0,0.45), 0 0 0 4px rgba(255,255,255,0.09);
        z-index: 2;
    }

    .level-tile[data-level="A1"]:not(.disabled) { background: #e57373; }
    .level-tile[data-level="A2"]:not(.disabled) { background: #e6a23c; }
    .level-tile[data-level="B1"]:not(.disabled) { background: #f5c518; color: #1b1c1d; }
    .level-tile[data-level="B2"]:not(.disabled) { background: #2ecc71; }

    .level-tile.disabled {
        background: #232426;
        color: #555a60;
        cursor: not-allowed;
        opacity: 0.45;
    }

    .level-tile .tile-count {
        position: absolute;
        bottom: 14px;
        right: 18px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.06em;
        opacity: 0.9;
        font-variant-numeric: tabular-nums;
    }
    .level-tile.disabled .tile-count { opacity: 0.35; }

    .level-tile .ripple {
        position: absolute;
        border-radius: 50%;
        transform: scale(0);
        background: rgba(255,255,255,0.45);
        pointer-events: none;
        animation: rippleAnim 0.6s ease-out forwards;
    }
    @keyframes rippleAnim {
        to { transform: scale(3); opacity: 0; }
    }

    /* ===== Кнопка "Начать тренировку" ===== */
    .start-bar {
        flex: 0 0 auto;
        margin: 8px;
        border: none;
        border-radius: 22px;
        font-family: inherit;
        color: #1b1c1d;
        background: #ffffff;
        cursor: pointer;
        padding: 1em;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 16vh;
        transition: transform 0.1s, box-shadow 0.2s;
        position: relative;
        overflow: hidden;
    }
    .start-bar:hover  { box-shadow: 0 12px 40px rgba(255,255,255,0.15); }
    .start-bar:active { transform: scale(0.985); }

    .start-bar .sb-label {
        font-size: clamp(24px, 5vw, 40px);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.1;
        text-align: center;
    }

    /* ===== Мобильные ===== */
    @media (max-width: 720px) {
        .topbar { min-height: 62px; padding: 0 0.6em 0 0.9em; }
        .lang-badge { min-width: 100px; height: 46px; padding: 0 1em; font-size: 14px; }
        .level-icon { width: 46px; height: 46px; font-size: 15px; }
        .history-btn { height: 46px; padding: 0 1.1em; font-size: 15px; }
        .settings-btn { width: 46px; height: 46px; }
        .settings-btn svg { width: 22px; height: 22px; }

        .levels-board { gap: 6px; padding: 6px; }
        .start-bar { min-height: 20vh; border-radius: 18px; margin: 6px; }
    }

    @media (max-height: 500px) and (orientation: landscape) {
        .levels-board {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
        }
        .start-bar {
            flex: 0 0 34%;
            min-height: 0;
            margin: 6px;
        }
        .start-bar .sb-label { font-size: 22px; }
    }
</style>
</head>
<body>
    <div class="stage">
        <nav class="topbar">
            <div class="brand">
                <button class="lang-badge" id="langBtn" title="Сменить язык">English</button>
                <button class="level-icon" id="lvlTopBtn" title="Сменить уровень">A1</button>
            </div>
            <div class="right">
                <button class="history-btn" id="historyBtn">Результаты</button>
                <button class="settings-btn" id="settingsBtn" title="Настройки">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
            </div>
        </nav>

        <main class="wrapper">
            <div class="levels-board" id="board">
                <button class="level-tile active" data-level="A1">
                    A1 <span class="tile-count">13 / 20</span>
                </button>
                <button class="level-tile" data-level="A2">
                    A2 <span class="tile-count">0 / 40</span>
                </button>
                <button class="level-tile" data-level="B1">
                    B1 <span class="tile-count">0 / 60</span>
                </button>
                <button class="level-tile" data-level="B2">
                    B2 <span class="tile-count">0 / 80</span>
                </button>
                <button class="level-tile disabled" data-level="C1" disabled>
                    C1 <span class="tile-count">—</span>
                </button>
                <button class="level-tile disabled" data-level="C2" disabled>
                    C2 <span class="tile-count">—</span>
                </button>
            </div>

            <button class="start-bar" id="startBtn">
                <span class="sb-label">Начать тренировку</span>
            </button>
        </main>
    </div>

<script>
(function() {
    const LANG_KEY = 'wordlist_lang';
    const LANGS = ['en', 'tr', 'de'];
    const LANG_LABELS = { en: 'English', tr: 'Türkçe', de: 'Deutsch' };
    const LANG_COLORS = { en: '#6b8cae', tr: '#b56b6b', de: '#c89b54' };

    const LEVEL_COLORS = {
        A1: '#e57373',
        A2: '#e6a23c',
        B1: '#f5c518',
        B2: '#2ecc71',
        C1: '#3f4145',
        C2: '#3f4145',
    };

    let currentLang = localStorage.getItem(LANG_KEY);
    if (!LANG_LABELS[currentLang]) currentLang = 'en';

    let currentLevel = 'A1';

    const langBtn     = document.getElementById('langBtn');
    const lvlTopBtn   = document.getElementById('lvlTopBtn');
    const board       = document.getElementById('board');
    const historyBtn  = document.getElementById('historyBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const startBtn    = document.getElementById('startBtn');

    function nextLang(code) {
        const i = LANGS.indexOf(code);
        return LANGS[(i + 1) % LANGS.length];
    }

    function updateLangBadge() {
        langBtn.textContent = LANG_LABELS[currentLang];
        langBtn.style.background = LANG_COLORS[currentLang];
    }

    function updateLevelBadge() {
        lvlTopBtn.textContent = currentLevel;
        lvlTopBtn.style.background = LEVEL_COLORS[currentLevel];
        lvlTopBtn.style.color = currentLevel === 'B1' ? '#1b1c1d' : '#fff';
    }

    function setActiveLevel(level) {
        currentLevel = level;
        board.querySelectorAll('.level-tile').forEach(tile => {
            tile.classList.toggle('active', tile.dataset.level === level);
        });
        updateLevelBadge();
    }

    function attachRipple(el) {
        el.addEventListener('click', (e) => {
            if (el.disabled || el.classList.contains('disabled')) return;
            const rect = el.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = (e.clientX ?? rect.left + rect.width / 2) - rect.left - size / 2;
            const y = (e.clientY ?? rect.top + rect.height / 2) - rect.top - size / 2;
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            el.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });
    }
    board.querySelectorAll('.level-tile').forEach(attachRipple);
    [langBtn, lvlTopBtn, historyBtn, settingsBtn, startBtn].forEach(attachRipple);

    board.querySelectorAll('.level-tile').forEach(tile => {
        tile.addEventListener('click', () => {
            if (tile.disabled || tile.classList.contains('disabled')) return;
            setActiveLevel(tile.dataset.level);
        });
    });

    langBtn.addEventListener('click', () => {
        currentLang = nextLang(currentLang);
        localStorage.setItem(LANG_KEY, currentLang);
        updateLangBadge();
        langBtn.animate(
            [
                { transform: 'scale(1)' },
                { transform: 'scale(0.92)' },
                { transform: 'scale(1)' }
            ],
            { duration: 220, easing: 'ease-out' }
        );
    });

    lvlTopBtn.addEventListener('click', () => {
        const enabledTiles = [...board.querySelectorAll('.level-tile:not(.disabled)')];
        const i = enabledTiles.findIndex(t => t.dataset.level === currentLevel);
        const next = enabledTiles[(i + 1) % enabledTiles.length];
        if (next) setActiveLevel(next.dataset.level);
    });

    startBtn.addEventListener('click', () => {
        const label = startBtn.querySelector('.sb-label');
        const original = label.textContent;
        label.textContent = 'Поехали…';
        setTimeout(() => { label.textContent = original; }, 800);
    });

    historyBtn.addEventListener('click', () => {
        historyBtn.animate(
            [{ transform: 'scale(1)' }, { transform: 'scale(0.94)' }, { transform: 'scale(1)' }],
            { duration: 200, easing: 'ease-out' }
        );
    });
    settingsBtn.addEventListener('click', () => {
        settingsBtn.animate(
            [{ transform: 'rotate(0)' }, { transform: 'rotate(90deg)' }, { transform: 'rotate(0)' }],
            { duration: 350, easing: 'ease-out' }
        );
    });

    document.addEventListener('keydown', (e) => {
        if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
        const enabledTiles = [...board.querySelectorAll('.level-tile:not(.disabled)')];
        const i = enabledTiles.findIndex(t => t.dataset.level === currentLevel);
        const next = enabledTiles[(i + (e.key === 'ArrowRight' ? 1 : -1) + enabledTiles.length) % enabledTiles.length];
        if (next) setActiveLevel(next.dataset.level);
    });

    updateLangBadge();
    updateLevelBadge();
})();
</script>
</body>
</html>
